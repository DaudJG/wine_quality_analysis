[project]
name = "wine-quality-analysis"
version = "0.1.0"
description = "Educational wine data analysis and an interactive Dash dashboard"
requires-python = ">=3.12,<3.14"
dependencies = [
  "dash>=3,<4",
  "plotly>=6,<7",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<0.14",
  "statsmodels>=0.14,<0.15",
  "scipy>=1.12,<2",
  "pingouin>=0.5,<0.6",
  "scikit-learn>=1.4,<2",
  "tabulate>=0.9,<1",
]

[dependency-groups]
dev = ["ipykernel>=6,<8", "nbclient>=0.10,<0.11", "nbformat>=5.10,<6"]

[tool.uv]
package = false
